name: ci

# Every gate lives in lateregate, pinned in go.mod. The reusable workflow
# asks the binary which gates apply and runs one job per gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1

  enum-typescript-tests:
    name: TypeScript enum analyzer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run test:enums
