name: ci

# Every gate lives in lateregate, pinned in go.mod. The reusable workflow
# asks the binary which gates apply and runs one job per gate.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner is better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    uses: latere-ai/ci/.github/workflows/lateregate.yml@6eb848f143466052e189af3d4820069003eec692

  enum-typescript-tests:
    name: TypeScript enum analyzer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run test:enums
