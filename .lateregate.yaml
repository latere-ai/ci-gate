# The decisions this repository has made, each with its reason. Everything
# the tool can decide for a repository it decides by default, so a key here
# is one somebody chose. This is the tool gating itself with its own file,
# which is the only way the schema stays honest.
cover:
  exempt:
    # The value is the reason. lateregate rejects an empty one.
    cmd/lateregate: >-
      main() is flag parsing and os.Exit around run(), which is tested
      directly; every command it dispatches to is covered in its own package

spec:
  # A closed vocabulary; the index row and the frontmatter must agree.
  status: [draft, partial, complete]
  wikilinks: true
  # Every spec here is NNN-name.md, and the number is what the index rows, the
  # wikilinks and the commit messages all cite.
  numbered: true
  # This tree has no dispatch statuses, so `complete` is both the point at
  # which work has started and the point at which a dependency has closed. A
  # tree with a longer vocabulary lists more of them.
  started: [complete]
  settled: [complete]

hermetic:
  # gofmt and go live in the toolchain directory and need nothing named here.
  # git does: fmt-check asks git which Go files the repository tracks, so the
  # gate's own test needs it, and naming the directory is how that dependency
  # stays visible instead of ambient.
  allow: [/usr/bin]

license:
  # No default: an identifier guessed on a repository's behalf would be
  # printed into every file it has. Declaring it is the decision the gate
  # checks the tree against.
  spdx: MIT
  holder: Latere AI
  extensions: ['.go']
  names: [Makefile]
