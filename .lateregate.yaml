# The gate configuration for this repository. Every consumer repo carries one
# of these; this is the tool gating itself with it, which is the only way the
# schema stays honest.
cover:
  threshold: 90.0
  trim_prefix: latere.ai/x/ci-gate/
  exempt:
    # The value is the reason. lateregate rejects an empty one.
    cmd/lateregate: >-
      main() is flag parsing and os.Exit around run(), which is tested
      directly; every command it dispatches to is covered in its own package

spec:
  # This repository lints its own spec tree with its own binary. A gate whose
  # only consumer is a repo that does not run it is a gate nobody checks.
  dir: specs
  status: [draft, partial, complete]
  require: [title, status]
  index: specs/README.md
  wikilinks: true

hermetic:
  # The suite shells out to gofmt and go, both of which live in the toolchain
  # directory. Nothing else, which is the setting every repo should aim at.
  allow: []

modernize:
  # Read by two gates: `go fix` through `make lint-modernize`, and the
  # modernize linter in the generated .golangci.yml. They are the same
  # analyzers, so a fixer turned off for one and left on for the other is this
  # repository disagreeing with itself -- which it was, until generation made
  # it visible.
  disable:
    # newexpr rewrites pointer helpers such as func ptr(v T) *T to new(v), then
    # inlines call sites unevenly: the helper is left with no callers (which
    # trips unused), and an untyped constant argument takes the wrong default
    # type.
    - newexpr
    # errorsastype rewrites errors.As to errors.AsType[T], whose type parameter
    # is constrained to [E error]. A local non-error interface target does not
    # satisfy it, so the rewrite does not compile.
    - errorsastype

tempdir:
  # The suite is watched against an empty TMPDIR and nothing may survive it.
  # This repo's own tests make temporary directories and remove them, which is
  # the state every consumer repo should be able to reach.
  #
  # command is unset, so the default `go test ./...` runs. A repo whose real
  # coverage lives behind a build tag or a slower target names it here: a leak
  # the gate never executes is a leak it reports as absent.
  allow: {}

license:
  # The identifier every source file carries, and the holder it names. There
  # is no default: an identifier guessed on a repository's behalf would be
  # printed into every file it has. Declaring it here is what the gate checks
  # the tree against.
  spdx: MIT
  holder: Latere AI
